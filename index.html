<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Premier League weekend map | sportmapz</title>
  <meta name="description" content="Every Premier League game this weekend on one map: kick-off times, stadiums, table positions and routes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <aside id="panel" aria-label="Matches">
    <header class="brand">
      <a class="brand-logo" href="https://sportmapz.com" target="_blank" rel="noopener" aria-label="sportmapz.com"><img id="logo" src="assets/sportmapz-logo.png" alt="sportmapz" width="175" height="30"></a>
      <a class="brand-url" href="https://sportmapz.com" target="_blank" rel="noopener">sportmapz.com</a>
    </header>

    <!-- LIST VIEW -->
    <section id="view-list" class="view">
      <div class="title-block">
        <h1 id="league-title" tabindex="-1">Premier League</h1>
        <p id="league-sub" class="sub"></p>
      </div>
      <div class="toolbar">
        <button type="button" class="chip is-on" data-zoom="all">All matches</button>
        <button type="button" class="chip" data-zoom="london" id="chip-london" hidden>London</button>
        <button type="button" class="chip chip-tour" id="tourBtn">Play tour</button>
      </div>
      <div id="list" class="list"></div>
      <p class="legal">Unofficial fan map, not affiliated with the Premier League or any club. Kick-off times can change for TV, check the club site before you travel.</p>
    </section>

    <!-- DETAIL VIEW -->
    <section id="view-detail" class="view" hidden>
      <button type="button" id="closeDetail" class="close" aria-label="Close and show all matches">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <div id="detail-body"></div>
    </section>
  </aside>

  <main id="stage">
    <div id="map" aria-label="Map of Premier League stadiums"></div>
    <div class="map-tools">
      <button type="button" id="btnReset" class="tool" aria-label="Reset view and show all locations" title="Show all locations">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
      </button>
      <button type="button" id="btnFull" class="tool" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="notice" class="notice" hidden></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
